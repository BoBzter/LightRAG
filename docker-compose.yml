services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: lightrag-postgres
    environment:
      POSTGRES_USER: lightrag
      POSTGRES_PASSWORD: lightrag_password
      POSTGRES_DB: lightrag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lightrag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightrag -d lightrag"]
      interval: 10s
      timeout: 5s
      retries: 5

  lightrag:
    container_name: lightrag
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-9621}:9621"
    volumes:
      - ./data/rag_storage:/app/data/rag_storage
      - ./data/inputs:/app/data/inputs
      - ./config.ini:/app/config.ini
      - ./.env:/app/.env
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rerank:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lightrag-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  rerank:
    image: vllm/vllm-openai:latest
    container_name: lightrag-rerank
    command: >
      --model BAAI/bge-reranker-v2-m3
      --task score
      --dtype float16
      --max-model-len 1024
      --port 8080
      --trust-remote-code
    ports:
      - "8080:8080"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - hf-cache:/root/.cache/huggingface
    networks:
      - lightrag-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 600s
      timeout: 20s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  hf-cache:

networks:
  lightrag-network:
    driver: bridge